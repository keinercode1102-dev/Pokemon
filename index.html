<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dragon Ball · Explorador de personajes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="hero">
  <div class="hero-orb"></div>
  <h1>DRAGON BALL</h1>
  <p class="tag">Explora personajes, razas y transformaciones del universo Dragon Ball, con datos en vivo de la API pública.</p>
</div>

<div class="controls">
  <div class="search-row">
    <input id="searchInput" type="text" placeholder="Buscar un personaje, ej. Goku, Vegeta, Piccolo...">
    <button id="searchBtn">Buscar</button>
  </div>
  <div class="race-row" id="raceRow"></div>
</div>

<div class="content">
  <p class="status-line" id="statusLine">Cargando personajes...</p>
  <div class="grid" id="grid"></div>
  <button class="load-more" id="loadMoreBtn" style="display:none;">Cargar más</button>
</div>

<footer>
  Datos proporcionados por <a href="https://dragonball-api.com" target="_blank" rel="noopener">dragonball-api.com</a>. Proyecto de fans, sin afiliación oficial con Toei Animation o Bird Studio.
</footer>

<div class="overlay" id="overlay">
  <div class="modal" id="modal"></div>
</div>

<script src="script.js"></script>
</body>
</html>
