<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5">
<title>PokéVault · Bóveda Pokémon</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="pokedex-header">
  <figure class="brand">
    <svg class="brand-mark" viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
      <polygon points="24,3 43,13.5 43,34.5 24,45 5,34.5 5,13.5" fill="none" stroke="#49e8ff" stroke-width="2"/>
      <polygon points="24,3 43,13.5 43,34.5 24,45 5,34.5 5,13.5" fill="rgba(73,232,255,0.06)"/>
      <circle cx="24" cy="24" r="7" fill="none" stroke="#b07bff" stroke-width="2"/>
      <circle cx="24" cy="24" r="2.4" fill="#ff5fae"/>
    </svg>
    <figcaption>
      <h1>PokéVault</h1>
      <p class="tagline">bóveda de datos · gen I</p>
    </figcaption>
  </figure>
  <search class="search-box">
    <input type="text" id="searchInput" placeholder="Nombre o Nº" aria-label="Buscar Pokémon">
    <button id="searchBtn">Buscar</button>
  </search>
</header>

<ul id="vaultStats" class="vault-stats" style="display:none;"></ul>

<menu id="filtersBar" class="filters-bar" style="display:none;">
  <li><button class="filter-chip active" data-rarity="all">Todas las rarezas</button></li>
  <li><button class="filter-chip" data-rarity="comun">Común</button></li>
  <li><button class="filter-chip" data-rarity="pocoComun">Poco común</button></li>
  <li><button class="filter-chip" data-rarity="raro">Raro</button></li>
  <li><button class="filter-chip" data-rarity="muyRaro">Muy raro</button></li>
  <li><button class="filter-chip" data-rarity="legendario">Legendario</button></li>
  <li><button class="filter-chip" data-rarity="mitico">Mítico</button></li>
</menu>

<nav id="sectionNav" class="section-nav" style="display:none;"></nav>

<p id="statusContainer" class="status-msg" style="display:none;"></p>
<output id="loaderContainer" class="loader" style="display:none;" aria-hidden="true"></output>
<p id="loadingNote" class="loading-note" style="display:none;">Accediendo a la bóveda · sincronizando 151 registros originales…</p>

<main id="sectionsContainer" style="width:100%; max-width:1300px;"></main>

<dialog id="modalCard" class="modal-card"></dialog>

<script src="script.js"></script>
</body>
</html>
